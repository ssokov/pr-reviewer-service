name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0
          args: --config .golangci.yml --timeout 5m

  test-unit:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: db
          POSTGRES_PASSWORD: db
          POSTGRES_DB: pr_system
        options: >-
          --health-cmd "pg_isready -U db -d pr_system"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U db -d pr_system; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 1
          done

      - name: Verify database connection
        run: |
          PGPASSWORD=db psql -h localhost -p 5432 -U db -d pr_system -c "SELECT version();"

      - name: Run migrations
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          echo "Running migrations..."
          migrate -path migrations -database "postgres://db:db@localhost:5432/pr_system?sslmode=disable" up
          echo "Migrations completed successfully"

      - name: Verify schema
        run: |
          PGPASSWORD=db psql -h localhost -p 5432 -U db -d pr_system -c "\dt"

      - name: Run all tests
        env:
          TEST_DATABASE_URL: "postgres://db:db@localhost:5432/pr_system?sslmode=disable"
        run: |
          echo "Running tests with DATABASE: $TEST_DATABASE_URL"
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./... 2>&1 | tee test_output.log
          echo ""
          echo "Test summary:"
          grep -E "^(ok|FAIL|\?|---)" test_output.log || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Report coverage
        run: |
          echo "Detailed coverage by package:"
          go tool cover -func=coverage.out | tail -20 || true
          echo ""
          go tool cover -func=coverage.out | awk '/^total:/ {print "Total coverage:", $3}' || true
          echo "Coverage check is informational only"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-unit]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build
        run: go build -v -o bin/pr-reviewer-service ./cmd/pr-reviewer-service

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-reviewer-service
          path: bin/pr-reviewer-service
          retention-days: 7
